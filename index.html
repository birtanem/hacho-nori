<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef8ff">
<title>하초놀이터</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%83%3C/text%3E%3C/svg%3E">

<body>
<div class="app" id="app">
  <header class="topbar">
    <h1>🍃 하초놀이터</h1>
    <div class="coin">🪙 <span id="coins">0</span></div>
  </header>

  <main class="view" id="view"></main>

  <nav class="tabbar" id="tabbar">
    <button type="button" data-tab="home"><b>🎮</b>게임</button>
    <button type="button" data-tab="kuji"><b>🎫</b>쿠지</button>
    <button type="button" data-tab="album"><b>🖼️</b>사진첩</button>
    <button type="button" data-tab="closet"><b>👕</b>꾸미기</button>
  </nav>

  <!-- 모달·토스트·게임 화면은 앱 영역 안에 겹쳐서 띄움 (1단계·7단계) -->
  <div class="layer" id="layer"></div>
</div>

<div class="rotate" aria-hidden="true">
  <div class="rotate-ic">📱</div>
  <p>세로로 돌려주세요 🙂</p>
</div>

<!-- 배포 캐시 대책: 모든 모듈을 버전 주소로 불러옴. 배포 전에 dev/bump-version.sh 로 v= 숫자를 올린다. -->
